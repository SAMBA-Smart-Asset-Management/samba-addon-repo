name: Battery Optimizer
version: "1.24.0"
slug: battery-optimizer
description: Optimizes battery charge/discharge schedule based on energy prices and forecasts
url: https://github.com/andy-moore-energy/scheduler
# NOTE: no `image:` field here — this config is used by DEV (dev-deploy.sh) which builds
# locally on the HA machine from the Dockerfile. The `image:` field is injected by CI
# into the GitHub Pages copy of this file so that PROD machines pull from GHCR.
arch:
  - amd64
  # aarch64 and armv7 support to be added once multi-arch hashes are resolved
startup: services
boot: manual
init: false
homeassistant_api: true
hassio_api: true
# manager: run.sh restarts HA core after copying SAMBA Battery (403 otherwise)
hassio_role: manager

options:
  # The battery is set up in the integration SAMBA Battery (Settings → Devices &
  # services); this add-on reads it from there (sensor.sb_battery).
  # Observe-only when off: the plan is made and published, the battery not steered.
  control_enabled: true
  # Defaults for the app's optimisation choice (Batterij → Control).
  grid_charging: true
  grid_discharging: true

schema:
  control_enabled: bool
  grid_charging: bool
  grid_discharging: bool

  # Only for sites without SAMBA Battery; with it these come from sensor.sb_battery
  # and stay empty here (HA lists them under unused optional options).
  battery_soc: str?
  oem_battery_state_entity: str?
  oem_battery_power_entity: str?
  oem_battery_online_entity: str?
  capacity_kwh: float(0.1,)?
  charge_power_kw: float(0.1,)?
  discharge_power_kw: float(0.1,)?
  rte: float(0.1,1.0)?
  cycles_per_day_max: float(0.1,)?
  soc_min: int(0,100)?
  soc_max: int(0,100)?
  degradation_cost_per_kwh: float(0,)?
  degradation_budget_start: str?
  grid_connection_kw: float(0.1,)?
  capex_eur: float(0,)?
  cycle_life: int(0,)?

map:
  - share:rw
  - config:rw
  - addons:ro
image: ghcr.io/samba-smart-asset-management/battery-optimizer
